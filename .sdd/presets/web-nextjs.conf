# Preset: Next.js (App Router, SSR/SSG — thân thiện SEO/AEO/GEO)
# Public pages phải SSG/SSR (không CSR thuần). seo-check đọc HTML đã build:
#   - export tĩnh (next.config: output: 'export')  → SEO_BUILD_DIR=out
#   - không export tĩnh → đổi SEO_BUILD_DIR=.next/server/app (HTML prerender) hoặc để trống để bỏ qua
LANGUAGE=TypeScript 5
FRAMEWORK=Next.js 15 (App Router)
DB=none
PKG_MANAGER=pnpm
INSTALL_CMD=pnpm install --frozen-lockfile
DEV_CMD=pnpm dev
LINT_CMD=pnpm lint
TEST_CMD=pnpm test
BUILD_CMD=pnpm build
COVERAGE_MIN=80
MAIN_BRANCH=main
UI_STACK=Next.js 15 + React 19
SEO_BUILD_DIR=out
AI_CRAWLERS=allow
