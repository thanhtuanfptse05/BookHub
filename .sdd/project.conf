# Cấu hình dự án — nguồn duy nhất cho lệnh & thông số. `scripts/init-project` điền file này.
# Định dạng KEY=VALUE. Để trống = chưa cấu hình (verify sẽ cảnh báo/bỏ qua; --strict thì fail).
PROJECT_NAME=
PROJECT_ONE_LINER=
USERS=
LANGUAGE=
FRAMEWORK=
DB=
PKG_MANAGER=
INSTALL_CMD=
DEV_CMD=
LINT_CMD=
TEST_CMD=
BUILD_CMD=
COVERAGE_MIN=80
MAIN_BRANCH=main
# --- Giao diện (bỏ trống nếu dự án không có UI; điền khi chốt stack) ---
UI_STACK=
A11Y_CMD=
VISUAL_CMD=
UI_CHECK=warn
UI_SRC=src
# --- Bảo mật & chống phình rác (tùy chọn; điền khi chốt stack) ---
# AUDIT_CMD=pnpm audit --audit-level=high   # hoặc: uv run pip-audit
AUDIT_CMD=
# UNUSED_CMD=pnpm knip                      # hoặc: uv run vulture src
UNUSED_CMD=
SRC_MAX_LINES=300
# --- Spec Kit (off | warn | error; setup-tools tự nâng lên error sau khi specify init) ---
REQUIRE_SPECKIT=warn
# --- SEO · AEO · GEO (chỉ cho website công khai; xem constraints/seo.md) ---
SITE_URL=
SEO_BUILD_DIR=
SEO_CHECK=warn
AI_CRAWLERS=allow
# --- CI/CD (deploy do CI chạy, KHÔNG phải Agent; xem docs/ci-cd.md) ---
# DEPLOY_CMD=npx wrangler pages deploy dist   # ví dụ; secrets lấy từ GitHub Secrets
DEPLOY_CMD=
